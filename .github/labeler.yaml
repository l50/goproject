---
area/github:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"

area/pre-commit:
  - changed-files:
      - any-glob-to-any-file:
          - ".pre-commit-config.yaml"
          - ".hooks/**/*"

area/go:
  - changed-files:
      - any-glob-to-any-file:
          - "pkg/**/*"
          - "cmd/**/*"
          - "*.go"
          - "magefiles/*"
          - "go.mod"
          - "go.sum"

area/mage:
  - changed-files:
      - any-glob-to-any-file:
          - "magefiles/*"
