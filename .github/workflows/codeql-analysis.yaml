---
name: 🚨 CodeQL Analysis
on:
  push:
  pull_request:

jobs:
  codeql:
    name: Evaluate code for vulnerabilities
    runs-on: ubuntu-latest
    # The only Go code lives in magefiles/ behind the mage build tag.
    env:
      GOFLAGS: -tags=mage

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["go"]

    steps:
      - name: Set up git repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@489225d82a57396c6f426a40e66d461b16b3461d # v2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@489225d82a57396c6f426a40e66d461b16b3461d # v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@489225d82a57396c6f426a40e66d461b16b3461d # v2
