---
name: 🚨 CodeQL Analysis
on:
  push:
  pull_request:

jobs:
  codeql:
    name: Evaluate code for vulnerabilities
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["go"]

    steps:
      - name: Set up git repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@489225d82a57396c6f426a40e66d461b16b3461d # v2
        with:
          languages: ${{ matrix.language }}

      # The only Go code lives in magefiles/ behind the mage build tag,
      # which autobuild skips, so build it explicitly.
      - name: Build
        working-directory: magefiles
        run: go build -tags mage ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@489225d82a57396c6f426a40e66d461b16b3461d # v2
