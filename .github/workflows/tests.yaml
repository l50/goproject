---
name: Tests
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  go-ci:
    uses: CowDogMoo/renovate-config/.github/workflows/go-ci.yaml@main
    permissions:
      contents: read
    with:
      pre-commit: false
      test-command: bash .hooks/go-unit-tests.sh coverage
      coverage-file: ""

  coveralls:
    name: Coveralls
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Generate the coverage output
        run: bash .hooks/go-unit-tests.sh coverage

      - name: Send the coverage output
        if: hashFiles('coverage-all.out') != ''
        uses: shogo82148/actions-goveralls@daabb2902148216a0b13c82107a6e67ed97f796e # v1
        with:
          path-to-profile: coverage-all.out

  report-failure:
    name: Report failure
    needs: [go-ci, coveralls]
    # Only report failures of pushes to the default branch; PR failures are
    # visible through the Checks section.
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report failure
        uses: nashmaniac/create-issue-action@6814b79f58a9e25070c226b0c847e67b0c06efdd # v1.2
        with:
          title: 🐛 Coverage report failed for ${{ github.sha }}
          base: main
          token: ${{ secrets.GITHUB_TOKEN }}
          labels: kind/bug
          body: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
